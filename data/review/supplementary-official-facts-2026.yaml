- school_code: '4111010012'
  name_zh: 北京服装学院
  facts:
    name_en:
      value: Beijing Institute of Fashion Technology
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    founded_year:
      value: 1959
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
      basis: 学校章程序言明确1959年2月建校，原名北京纺织工学院；1987年为改扩建现名
    badge_description:
      value: 校标采用中国印章形式，核心为篆体“衣”字，象征服装与中华文化；章程记载标准色为锦葵红和深灰，未在该页列出RGB或HEX。
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    history_events:
    - year: 1959
      event: 以北京纺织工学院名义建校
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    - year: 1961
      event: 更名为北京化学纤维工学院
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    - year: 1987
      event: 改扩建为北京服装学院
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    - year: 1998
      event: 划转北京市管理
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
    - year: 2019
      event: 由理工院校变更为艺术院校
      source: https://www.bift.edu.cn/xxgk/xyzc/index.htm
