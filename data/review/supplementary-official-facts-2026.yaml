- school_code: '4132010329'
  name_zh: 江苏警官学院
  facts:
    official_website:
      value: https://www.jspi.cn/
      source: https://www.jspi.cn/xygk/xyzc.htm
    name_en:
      value: Jiangsu Police Institute
      source: https://www.jspi.cn/xygk/xyzc.htm
    founded_year:
      value: 1949
      source: https://www.jspi.cn/xygk/xyzc.htm
      basis: 章程序言追溯至1949年成立的南京市公安学校；现名和本科升格年份为2002年
    motto:
      value: 无私奉献
      source: https://www.jspi.cn/xygk/xyzc.htm
    anthem:
      value: 《无上荣光——江苏警官学院校歌》
      source: https://www.jspi.cn/xygk/xyzc.htm
    badge_description:
      value: 盾牌内有五角星、书本与钢笔尖构成的天平及橄榄枝，外侧标注中英文校名。此处描述学校校标，与佩戴的长方形徽章区分。
      source: https://www.jspi.cn/xygk/xyzc.htm
    history_events:
    - year: 1949
      event: 前身南京市公安学校成立
      source: https://www.jspi.cn/xygk/xyzc.htm
    - year: 1953
      event: 更名为江苏省公安学校
      source: https://www.jspi.cn/xygk/xyzc.htm
    - year: 1978
      event: 复校并开始全日制专科教育
      source: https://www.jspi.cn/xygk/xyzc.htm
    - year: 1982
      event: 成立公安专科学校
      source: https://www.jspi.cn/xygk/xyzc.htm
    - year: 2002
      event: 升格本科并更名为江苏警官学院
      source: https://www.jspi.cn/xygk/xyzc.htm
