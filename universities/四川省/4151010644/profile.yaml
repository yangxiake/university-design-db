  summary_zh:
    value: 四川文理学院位于四川省达州市，主管部门为四川省。官网列示全日制在校生20000余人（统计时间2025-07）。官网列示教职工1500余人（统计时间2025-07）。官网列示占地面积1314亩（统计时间2025-07）。简介列出莲湖校区、南坝校区。
